name: CI

on:
  pull_request:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Sync project dependencies
        run: uv sync --project porth --all-groups --frozen

      - name: Run dependency audit
        run: uv audit --project porth --output-format sarif > uv-audit-results.sarif

      - name: Upload uv audit results to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: uv-audit-results.sarif

      - name: Check formatting with ruff
        run: uv run --project porth ruff format --check .

      - name: Lint with ruff
        run: uv run --project porth ruff check . --output-format github

      - name: Type check with ty
        run: uv run --project porth ty check . --output-format github

      - name: Run pytest with JUnit output
        run: uv run --project porth pytest --junitxml=pytest.xml

      - name: Publish pytest report
        if: always()
        uses: ctrf-io/github-test-reporter@v1
        with:
          report-path: pytest.xml
          summary-only: false

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit
          path: pytest.xml
          if-no-files-found: warn
